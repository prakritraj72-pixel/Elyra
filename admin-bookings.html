<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>ELYRA — Booking Management</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#080708;color:#fff;font-family:Inter,Arial,sans-serif}.wrap{max-width:1200px;margin:auto;padding:24px 16px 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}.brand{font-weight:900;letter-spacing:5px;font-size:22px}.brand span{color:#c85a83}.btn{border:1px solid #342936;background:#151117;color:#fff;padding:9px 12px;border-radius:10px;cursor:pointer}.btn:hover{border-color:#704158}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.search{flex:1;min-width:220px;background:#0e0b10;border:1px solid #2a222d;color:#fff;padding:11px 13px;border-radius:11px;outline:none}.list{display:grid;gap:10px}.booking{background:#110e13;border:1px solid #2a222d;border-radius:16px;padding:15px}.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.title{font-weight:800}.meta{color:#89808b;font-size:12px;line-height:1.65;margin-top:6px}.badge{display:inline-block;padding:5px 9px;border-radius:20px;font-size:10px;background:#2b2028;color:#e9bd69}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.success{background:#123521;border-color:#276a45}.danger{background:#4a1722;border-color:#702637}.empty{text-align:center;padding:40px;color:#777}.error{display:none;margin:12px 0;padding:12px;border:1px solid #6a2e3b;background:#220e14;color:#ff9cac;border-radius:10px;font-size:12px}</style></head><body><div class="wrap"><div class="top"><div class="brand">ELY<span>RA</span> <small style="font-size:11px;letter-spacing:1px;color:#777">BOOKINGS</small></div><div><button class="btn" onclick="location.href='admin-control-center.html'">← Control Center</button> <button class="btn" onclick="load()">↻ Refresh</button></div></div><div id="error" class="error"></div><div class="filters"><input id="search" class="search" placeholder="Search customer, phone, creator or status…"><button class="btn" onclick="filterStatus='all';render()">All</button><button class="btn" onclick="filterStatus='pending';render()">Pending</button><button class="btn" onclick="filterStatus='confirmed';render()">Confirmed</button><button class="btn" onclick="filterStatus='completed';render()">Completed</button><button class="btn" onclick="filterStatus='cancelled';render()">Cancelled</button></div><div id="list" class="list"><div class="empty">Loading bookings…</div></div></div><script>const URL='https://frvvacirnfvlxifvopcm.supabase.co',KEY='sb_publishable_l7fygMVXGAkbskkiBom8uw_-86tU6L0',ADMIN='2b6e3748-1702-4cdc-b38d-b826577af65a';const db=supabase.createClient(URL,KEY);let rows=[],filterStatus='all';const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function auth(){const {data:{session}}=await db.auth.getSession();if(!session?.user){location.href='login.html?redirect=admin-bookings.html';return false}if(session.user.id!==ADMIN){$('error').textContent='Access denied.';$('error').style.display='block';return false}return true}function render(){const q=$('search').value.toLowerCase();const out=rows.filter(b=>(filterStatus==='all'||String(b.status).toLowerCase()===filterStatus)&&(!q||JSON.stringify(b).toLowerCase().includes(q))).map(b=>`<article class="booking"><div class="head"><div><div class="title">${esc(b.customer_name||'Customer')} → ${esc(b.creator_name||b.creator_username||'Creator')}</div><div class="meta">${esc(b.booking_date||'—')} • ${esc(b.start_time||'')}–${esc(b.end_time||'')} • ${esc(b.duration_hours||'')} hrs<br>Amount: ₹${Number(b.amount??b.total_amount??0).toLocaleString('en-IN')} • Phone: ${esc(b.customer_phone||'—')}<br>Status: <span class="badge">${esc(b.status||'unknown')}</span></div></div></div><div class="actions">${['pending','confirmed','started','completed','cancelled'].map(s=>`<button class="btn ${s==='completed'?'success':s==='cancelled'?'danger':''}" onclick="setStatus('${b.id}','${s}')">${s[0].toUpperCase()+s.slice(1)}</button>`).join('')}</div></article>`).join('');$('list').innerHTML=out||'<div class="empty">No bookings found.</div>'}async function load(){if(!await auth())return;$('list').innerHTML='<div class="empty">Loading bookings…</div>';const {data,error}=await db.rpc('admin_list_bookings');if(error){$('error').textContent=error.message;$('error').style.display='block';return}rows=Array.isArray(data)?data:[];render()}async function setStatus(id,status){const {error}=await db.rpc('admin_set_booking_status',{p_booking_id:id,p_status:status});if(error){alert(error.message);return}await load()}$('search').addEventListener('input',render);load();</script></body></html>
