<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ELYRA — Creator Payments</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#080708;--card:#110d11;--line:#2b2229;--pink:#c85a83;--green:#65d696;--red:#ff7188;--yellow:#e9bd69}*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,sans-serif;background:var(--bg);color:#fff;min-height:100vh}.nav{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 5%;background:#090809;position:sticky;top:0}.logo{font-size:22px;font-weight:900;letter-spacing:4px}.logo span{color:var(--pink)}.nav a{color:#bbb;text-decoration:none;font-size:12px}.wrap{max-width:1150px;margin:auto;padding:30px 16px}.head{margin-bottom:20px}.head h1{font-size:clamp(30px,5vw,46px)}.head h1 span{color:var(--pink)}.head p{color:#777;font-size:12px;margin-top:7px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}.stat b{font-size:22px}.stat div{color:#777;font-size:10px;margin-top:4px}.tabs{display:flex;gap:8px;margin-bottom:15px;overflow:auto}.tab{border:1px solid var(--line);background:#0d0b0d;color:#aaa;padding:9px 13px;border-radius:999px;cursor:pointer;font-size:11px}.tab.active{background:var(--pink);color:#fff}.list{display:grid;gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:17px}.top{display:flex;justify-content:space-between;gap:10px}.name{font-weight:800}.email,.meta{color:#777;font-size:10px;margin-top:4px;line-height:1.5}.badge{padding:6px 9px;border-radius:999px;font-size:10px;font-weight:800;height:max-content;text-transform:capitalize}.pending{color:var(--yellow);background:rgba(233,189,105,.08)}.approved{color:var(--green);background:rgba(101,214,150,.08)}.rejected{color:var(--red);background:rgba(255,113,136,.08)}.details{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:13px}.detail{background:#0b090b;border:1px solid rgba(255,255,255,.05);border-radius:9px;padding:10px}.detail small{display:block;color:#666;font-size:9px;margin-bottom:4px}.detail b{font-size:11px;word-break:break-word}.actions{display:flex;gap:8px;margin-top:13px}.actions button{border:0;border-radius:9px;padding:10px 14px;font-size:11px;font-weight:800}.accept{background:var(--green);color:#04150e}.reject{background:rgba(255,113,136,.1);color:#ff9cac;border:1px solid rgba(255,113,136,.25)!important}.notice{display:none;padding:12px;border-radius:10px;margin-bottom:14px;font-size:11px;line-height:1.5}.notice.show{display:block}.ok{background:rgba(101,214,150,.08);border:1px solid rgba(101,214,150,.25);color:#9be3b7}.err{background:rgba(255,113,136,.08);border:1px solid rgba(255,113,136,.25);color:#ff9cac}.empty{padding:45px;text-align:center;color:#666;border:1px dashed var(--line);border-radius:14px}@media(max-width:800px){.stats{grid-template-columns:1fr 1fr}.details{grid-template-columns:1fr 1fr}}@media(max-width:520px){.wrap{padding:22px 11px}.stats{grid-template-columns:1fr 1fr}.details{grid-template-columns:1fr}.actions{flex-direction:column}.actions button{width:100%}}</style></head>
<body><header class="nav"><a class="logo" href="admin.html">ELY<span>RA</span></a><a href="admin-subscriptions.html">← Subscription Payments</a></header><main class="wrap"><div class="head"><h1>Creator <span>Payments</span></h1><p>Manual UPI creator activation requests. Only approved requests activate a creator profile.</p></div><div id="notice" class="notice"></div><div class="stats"><div class="stat"><b id="total">0</b><div>Total</div></div><div class="stat"><b id="pending">0</b><div>Pending</div></div><div class="stat"><b id="approved">0</b><div>Approved</div></div><div class="stat"><b id="revenue">₹0</b><div>Approved Revenue</div></div></div><div class="tabs"><button class="tab active" data-filter="all">All</button><button class="tab" data-filter="pending">Pending</button><button class="tab" data-filter="approved">Approved</button><button class="tab" data-filter="rejected">Rejected</button></div><div id="list" class="list">Loading…</div></main>
<script>const SUPABASE_URL='https://frvvacirnfvlxifvopcm.supabase.co';const SUPABASE_KEY='sb_publishable_l7fygMVXGAkbskkiBom8uw_-86tU6L0';const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let rows=[],filter='all';const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}function note(type,text){$('notice').className='notice show '+type;$('notice').textContent=text;}function render(){const data=filter==='all'?rows:rows.filter(r=>r.status===filter);$('list').innerHTML=data.length?data.map(r=>`<article class="card"><div class="top"><div><div class="name">${esc(r.creator_name||'Creator')}</div><div class="email">${esc(r.user_email||'No email')}</div><div class="meta">${esc(r.city||'India')} · ${new Date(r.created_at).toLocaleString('en-IN')}</div></div><span class="badge ${esc(r.status)}">${esc(r.status)}</span></div><div class="details"><div class="detail"><small>Amount</small><b>₹${Number(r.amount).toLocaleString('en-IN')}</b></div><div class="detail"><small>Transaction / UTR</small><b>${esc(r.transaction_id)}</b></div><div class="detail"><small>Request ID</small><b>${esc(String(r.id).slice(0,8))}</b></div><div class="detail"><small>Creator ID</small><b>${esc(String(r.creator_profile_id).slice(0,8))}</b></div></div>${r.rejection_reason?`<div class="meta" style="color:#ff9cac;margin-top:10px">Reason: ${esc(r.rejection_reason)}</div>`:''}${r.status==='pending'?`<div class="actions"><button class="accept" data-id="${esc(r.id)}" data-action="approve">✓ Accept & Activate</button><button class="reject" data-id="${esc(r.id)}" data-action="reject">Reject</button></div>`:''}</article>`).join(''):'<div class="empty">No creator payment requests found.</div>'}async function load(){const {data:{session}}=await sb.auth.getSession();if(!session){location.href='login.html?redirect=admin-creator-payments.html';return}const {data,error}=await sb.rpc('admin_list_creator_activation_requests');if(error){$('list').innerHTML='<div class="empty">'+esc(error.message)+'</div>';return}rows=data||[];$('total').textContent=rows.length;$('pending').textContent=rows.filter(x=>x.status==='pending').length;$('approved').textContent=rows.filter(x=>x.status==='approved').length;$('revenue').textContent='₹'+rows.filter(x=>x.status==='approved').reduce((a,x)=>a+Number(x.amount||0),0).toLocaleString('en-IN');render()}async function review(id,action){let reason='';if(action==='reject'){reason=prompt('Reason for rejection (optional):')??''}if(action==='approve'&&!confirm('Accept this ₹20 payment and activate this creator profile?'))return;const {data,error}=await sb.rpc('admin_review_creator_activation',{p_request_id:id,p_action:action,p_rejection_reason:reason});if(error)note('err',error.message);else if(!data?.success)note('err',data?.message||'Action failed.');else{note('ok',action==='approve'?'Creator activated successfully.':'Payment request rejected.');await load()}}document.addEventListener('click',e=>{const t=e.target.closest('.tab');if(t){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');filter=t.dataset.filter;render()}const a=e.target.closest('[data-action]');if(a)review(a.dataset.id,a.dataset.action)});load();</script></body></html>
