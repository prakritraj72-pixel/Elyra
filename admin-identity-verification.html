<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ELYRA Admin — Identity Verification</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#070609;--card:#110d12;--line:#2b222d;--pink:#c85a83;--muted:#8c828d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Arial,sans-serif}.top{height:70px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 5%}.brand{font-weight:900;letter-spacing:4px;font-size:22px}.brand span{color:var(--pink)}.top a{color:#aaa;text-decoration:none;font-size:12px}.wrap{max-width:1100px;margin:35px auto;padding:0 16px 70px}h1{margin:0 0 7px;font-size:30px}.sub{color:var(--muted);font-size:12px;line-height:1.6}.toolbar{margin:22px 0;display:flex;gap:9px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#171218;color:#fff;border-radius:9px;padding:10px 13px;cursor:pointer}.list{display:grid;gap:14px}.item{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:17px}.head{display:flex;justify-content:space-between;gap:15px}.badge{padding:5px 9px;border-radius:20px;font-size:10px}.pending{background:#3b2c13;color:#efd18e}.verified{background:#123521;color:#9ff0c2}.rejected{background:#381620;color:#ff9cab}.meta{color:#8d848f;font-size:11px;line-height:1.7;margin-top:8px}.docs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:15px}.docs img{width:100%;height:300px;object-fit:contain;background:#050505;border:1px solid var(--line);border-radius:12px}.actions{display:flex;gap:8px;margin-top:14px}.approve{background:#16462d;border-color:#276a45}.reject{background:#541d2b;border-color:#713042}.reason{flex:1;background:#090809;color:#fff;border:1px solid var(--line);border-radius:9px;padding:10px}.msg{padding:14px;border:1px solid var(--line);border-radius:12px;color:#aaa;font-size:12px}@media(max-width:700px){.docs{grid-template-columns:1fr}.docs img{height:240px}.head{flex-direction:column}}</style></head><body><header class="top"><div class="brand">ELY<span>RA</span></div><a href="admin.html">← Admin Dashboard</a></header><main class="wrap"><h1>Identity Verification</h1><p class="sub">Review government-ID and selfie submissions. Approve only when the submitted documents are sufficiently clear and appear consistent. This manual process is not automated KYC or biometric liveness verification.</p><div class="toolbar"><button class="btn" onclick="load()">↻ Refresh</button><button class="btn" onclick="location.href='admin-subscriptions.html'">Subscriptions</button></div><div id="msg" class="msg">Loading…</div><div id="list" class="list"></div></main><script>
const URL='https://frvvacirnfvlxifvopcm.supabase.co',KEY='sb_publishable_l7fygMVXGAkbskkiBom8uw_-86tU6L0',ADMIN='2b6e3748-1702-4cdc-b38d-b826577af65a';const sb=window.supabase.createClient(URL,KEY),$=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
async function auth(){const {data:{session}}=await sb.auth.getSession();if(!session){location.href='login.html?redirect=admin-identity-verification.html';return false}if(session.user.id!==ADMIN){$('msg').textContent='Access denied.';return false}return true}
async function signed(path){if(!path)return '';const {data,error}=await sb.storage.from('identity-documents').createSignedUrl(path,600);return error?'':data?.signedUrl||''}
async function load(){if(!await auth())return;$('msg').textContent='Loading verification requests…';const {data,error}=await sb.rpc('admin_list_identity_verifications');if(error){$('msg').textContent=error.message;return}if(!data?.length){$('msg').textContent='No verification requests yet.';$('list').innerHTML='';return}$('msg').textContent=`${data.length} verification request(s)`;$('list').innerHTML='';for(const r of data){const idUrl=await signed(r.id_document_path),selfieUrl=await signed(r.selfie_path);const item=document.createElement('article');item.className='item';item.innerHTML=`<div class="head"><div><b>${esc(r.user_email||r.user_id)}</b><div class="meta">Role: ${esc(r.role)} · Submitted: ${new Date(r.created_at).toLocaleString('en-IN')}<br>Status: ${esc(r.status)}</div></div><span class="badge ${esc(r.status)}">${esc(r.status.toUpperCase())}</span></div><div class="docs"><div>${idUrl?`<img src="${idUrl}" alt="Government ID">`:'<div class="msg">ID file unavailable</div>'}</div><div>${selfieUrl?`<img src="${selfieUrl}" alt="Selfie">`:'<div class="msg">Selfie unavailable</div>'}</div></div>${r.status==='pending'?`<div class="actions"><input id="reason-${r.id}" class="reason" placeholder="Rejection reason (only needed for reject)"><button class="btn approve" onclick="review('${r.id}','verified')">Approve</button><button class="btn reject" onclick="review('${r.id}','rejected')">Reject</button></div>`:''}`;$('list').appendChild(item)}}
async function review(id,status){const reason=status==='rejected'?document.getElementById('reason-'+id)?.value.trim():null;if(status==='rejected'&&!reason){alert('Enter a rejection reason.');return}if(status==='verified'&&!confirm('Approve this identity verification after reviewing both images?'))return;const {data,error}=await sb.rpc('admin_review_identity_verification',{p_id:id,p_status:status,p_rejection_reason:reason});if(error){alert(error.message);return}if(!data?.success){alert(data?.message||'Review failed');return}load()}
load();
</script></body></html>
