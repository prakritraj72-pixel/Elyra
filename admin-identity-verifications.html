<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>ELYRA — Identity Reviews</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#070707;--card:#101010;--line:#292029;--pink:#ff3f8f;--muted:#999;--green:#36d98b;--red:#ff6178;--yellow:#e8bd67}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Arial,sans-serif}.nav{height:70px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 5%}.brand{color:#fff;text-decoration:none;font-weight:900;font-size:24px;letter-spacing:3px}.brand span{color:var(--pink)}.back{color:#aaa;text-decoration:none;font-size:13px}.wrap{max-width:1100px;margin:35px auto;padding:0 16px 70px}h1{font-size:32px;margin:0 0 8px}h1 span{color:var(--pink)}.sub{color:var(--muted);font-size:13px}.toolbar{display:flex;gap:10px;align-items:center;margin:22px 0}.toolbar button,.review button{border:0;border-radius:9px;padding:11px 15px;font-weight:700;cursor:pointer}.refresh{background:#fff;color:#000}.danger{background:var(--red);color:#fff}.success{background:var(--green);color:#06140d}.grid{display:grid;gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}.head{display:flex;justify-content:space-between;gap:10px;align-items:center}.badge{font-size:10px;padding:6px 9px;border-radius:20px;background:#21141b;color:#ff9bc2}.meta{color:#888;font-size:11px;line-height:1.8;margin-top:10px}.docs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.doc{background:#090909;border:1px solid var(--line);border-radius:12px;padding:10px}.doc h3{font-size:11px;margin:0 0 8px;color:#ccc}.doc img{width:100%;height:230px;object-fit:contain;background:#050505;border-radius:8px}.actions{display:flex;gap:9px;margin-top:14px}.actions button{flex:1}.empty,.error{padding:25px;border:1px dashed var(--line);border-radius:14px;color:#888;text-align:center}.error{color:#ff9eaa;border-color:#4b2029}.reason{width:100%;background:#080808;border:1px solid var(--line);border-radius:9px;color:#fff;padding:10px;margin-top:10px;resize:vertical}@media(max-width:650px){.docs{grid-template-columns:1fr}.doc img{height:280px}.head{align-items:flex-start;flex-direction:column}}
</style></head><body><header class="nav"><a class="brand" href="admin.html">ELY<span>RA</span></a><a class="back" href="admin.html">← Admin</a></header><main class="wrap"><h1>Identity <span>Reviews</span></h1><p class="sub">Private manual review queue. Only the authorized Elyra admin can approve or reject verification requests.</p><div class="toolbar"><button class="refresh" id="refresh">Refresh</button><span id="count" class="sub"></span></div><div id="root" class="grid"><div class="empty">Checking admin access…</div></div></main><script>
const SUPABASE_URL='https://frvvacirnfvlxifvopcm.supabase.co';const SUPABASE_KEY='sb_publishable_l7fygMVXGAkbskkiBom8uw_-86tU6L0';const ADMIN='2b6e3748-1702-4cdc-b38d-b826577af65a';const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const root=document.getElementById('root'),count=document.getElementById('count');let session=null;
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function signed(path){if(!path)return null;const {data,error}=await sb.storage.from('identity-documents').createSignedUrl(path,300);return error?null:data?.signedUrl||null}
async function load(){root.innerHTML='<div class="empty">Loading reviews…</div>';const s=await sb.auth.getSession();session=s.data.session;if(!session||session.user.id!==ADMIN){root.innerHTML='<div class="error">Unauthorized admin account.</div>';count.textContent='';return}const {data,error}=await sb.rpc('admin_list_identity_verifications');if(error){root.innerHTML='<div class="error">'+esc(error.message)+'</div>';return}const rows=data||[];count.textContent=rows.length+' request'+(rows.length===1?'':'s');if(!rows.length){root.innerHTML='<div class="empty">No identity verification requests yet.</div>';return}root.innerHTML='';for(const r of rows){const [idUrl,selfieUrl]=await Promise.all([signed(r.document_storage_path),signed(r.selfie_storage_path)]);const card=document.createElement('section');card.className='card';card.innerHTML=`<div class="head"><div><strong>${esc(r.document_type||'Government ID')}</strong><div class="meta">User: ${esc(r.user_id)}<br>Submitted: ${esc(new Date(r.created_at).toLocaleString())}</div></div><span class="badge">${esc(r.verification_status)}</span></div><div class="docs"><div class="doc"><h3>Government ID</h3>${idUrl?`<img src="${idUrl}" alt="Government ID">`:'<div class="empty">Document unavailable</div>'}</div><div class="doc"><h3>Selfie</h3>${selfieUrl?`<img src="${selfieUrl}" alt="Selfie">`:'<div class="empty">Selfie unavailable</div>'}</div></div>${r.verification_status==='pending'?`<textarea class="reason" id="reason-${r.id}" rows="2" placeholder="Rejection reason (required when rejecting)"></textarea><div class="actions"><button class="success" data-action="approve" data-id="${r.id}">Approve</button><button class="danger" data-action="reject" data-id="${r.id}">Reject</button></div>`:`<div class="meta">${r.rejection_reason?'Reason: '+esc(r.rejection_reason):'Reviewed.'}</div>`}`;root.appendChild(card)}root.querySelectorAll('button[data-action]').forEach(b=>b.onclick=()=>review(b.dataset.id,b.dataset.action));}
async function review(id,action){if(action==='reject'){const reason=document.getElementById('reason-'+id)?.value.trim();if(!reason){alert('Please enter a rejection reason.');return}}else if(!confirm('Approve this identity verification? Make sure you manually checked the ID and selfie.'))return;const reason=action==='reject'?document.getElementById('reason-'+id)?.value.trim():null;const {data,error}=await sb.rpc('admin_review_identity_verification',{p_verification_id:id,p_decision:action==='approve'?'approved':'rejected',p_rejection_reason:reason});if(error){alert(error.message);return}if(!data?.success){alert(data?.message||'Review failed.');return}await load()}
document.getElementById('refresh').onclick=load;load();
</script></body></html>
