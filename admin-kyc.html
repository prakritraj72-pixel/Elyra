<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ELYRA Admin — KYC</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#070707;color:#fff;font-family:Arial,sans-serif;padding:22px}.wrap{max-width:1050px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.brand{font-weight:900;letter-spacing:3px;font-size:24px}.brand span{color:#ff3f8f}.back{color:#aaa;text-decoration:none}.card{background:#111;border:1px solid #242424;border-radius:16px;padding:18px;margin-bottom:14px}.item{display:grid;grid-template-columns:1fr auto;gap:15px;align-items:center}.meta{color:#999;font-size:12px;line-height:1.6}.name{font-size:15px;font-weight:800;margin-bottom:4px}.status{display:inline-block;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:800;margin-top:7px}.pending{background:#2a1b24;color:#ff9bc4}.verified{background:#12291e;color:#70e4a2}.rejected{background:#2b1719;color:#ff9696}.btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.btn{border:1px solid #333;background:#191919;color:#fff;padding:9px 11px;border-radius:9px;cursor:pointer;font-size:12px}.btn.verify{background:#ff3f8f;border-color:#ff3f8f;color:#080808;font-weight:800}.btn.reject{color:#ff9999}.empty{color:#777;text-align:center;padding:45px}.notice{color:#999;font-size:12px;line-height:1.6;margin-bottom:18px}@media(max-width:650px){.item{grid-template-columns:1fr}.btns{justify-content:flex-start}.top{align-items:flex-start;gap:10px;flex-direction:column}}
</style></head><body><div class="wrap"><div class="top"><div class="brand">EL<span>YRA</span> KYC</div><a class="back" href="admin.html">← Admin Dashboard</a></div><div class="notice">KYC status can only be marked <b>Verified</b> after an approved KYC provider has actually completed identity verification. Do not mark a user verified based only on a chat, selfie, or unverified claim.</div><div id="list"></div></div><script>
const SUPABASE_URL='https://frvvacirnfvlxifvopcm.supabase.co';const KEY='sb_publishable_l7fygMVXGAkbskkiBom8uw_-86tU6L0';const sb=window.supabase.createClient(SUPABASE_URL,KEY);const $=id=>document.getElementById(id);
async function load(){const {data:{session}}=await sb.auth.getSession();if(!session){location.href='login.html?redirect=admin-kyc.html';return}const {data,error}=await sb.rpc('admin_list_kyc');if(error){$('list').innerHTML='<div class="card">KYC RPC error: '+esc(error.message)+'</div>';return}const rows=Array.isArray(data)?data:[];if(!rows.length){$('list').innerHTML='<div class="card empty">No KYC requests yet.</div>';return}$('list').innerHTML=rows.map(r=>`<div class="card"><div class="item"><div><div class="name">${esc(r.user_id)}</div><div class="meta">Type: ${esc(r.user_type)}<br>Provider: ${esc(r.provider||'Not set')}<br>Reference: ${esc(r.provider_reference||'Not set')}<br>Created: ${r.created_at?new Date(r.created_at).toLocaleString('en-IN'):''}</div><span class="status ${esc(r.status)}">${esc(r.status).toUpperCase()}</span>${r.rejection_reason?`<div class="meta">Reason: ${esc(r.rejection_reason)}</div>`:''}</div><div class="btns"><button class="btn verify" onclick="setKyc('${r.user_id}','verified')">Verify</button><button class="btn reject" onclick="rejectKyc('${r.user_id}')">Reject</button><button class="btn" onclick="setKyc('${r.user_id}','pending')">Pending</button></div></div></div>`).join('')}
async function setKyc(userId,status,reason=null){const provider=status==='verified'?prompt('Enter KYC provider name:','Approved KYC Provider'):null;if(status==='verified'&&!provider)return;const reference=status==='verified'?prompt('Enter provider verification reference:',''):null;if(status==='verified'&&!reference)return;const {error}=await sb.rpc('admin_set_kyc_status',{p_user_id:userId,p_status:status,p_rejection_reason:reason,p_provider:provider,p_provider_reference:reference});if(error)alert(error.message);else load()}
async function rejectKyc(userId){const reason=prompt('Rejection reason:');if(!reason)return;setKyc(userId,'rejected',reason)}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}load();
</script></body></html>
