<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ELYRA — Booking Requests</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#070707;--card:#111;--border:rgba(255,63,143,.22);--pink:#ff3f8f;--muted:#aaa;--success:#36d98b;--danger:#ff4d67}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,Helvetica,sans-serif;background:radial-gradient(circle at top,rgba(255,63,143,.1),transparent 35%),var(--bg);color:#fff;min-height:100vh}a{text-decoration:none;color:inherit}button{font:inherit}.nav{height:70px;border-bottom:1px solid var(--border);background:rgba(7,7,7,.94);display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:10}.brand{font-size:25px;font-weight:900;letter-spacing:3px}.brand span{color:var(--pink)}.nav-right{display:flex;gap:10px;align-items:center}.nav-link,.logout{padding:9px 13px;border-radius:10px;border:1px solid var(--border);background:rgba(255,63,143,.06);color:#ddd;cursor:pointer}.container{max-width:1100px;margin:auto;padding:32px 16px 70px}.heading{margin-bottom:22px}.heading h1{font-size:clamp(30px,5vw,44px);margin-bottom:8px}.heading h1 span{color:var(--pink)}.heading p{color:var(--muted);line-height:1.5}.notice{display:none;padding:13px 15px;border-radius:12px;margin-bottom:18px;font-size:14px}.notice.show{display:block}.notice.success{color:#b8ffd9;background:rgba(54,217,139,.1);border:1px solid rgba(54,217,139,.25)}.notice.error{color:#ffb8c2;background:rgba(255,77,103,.1);border:1px solid rgba(255,77,103,.25)}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:18px;padding-bottom:3px}.tab{border:1px solid rgba(255,255,255,.1);background:#0d0d0d;color:#aaa;padding:9px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}.tab.active{background:var(--pink);color:#050505;border-color:var(--pink);font-weight:800}.list{display:grid;gap:14px}.card{background:linear-gradient(145deg,rgba(255,63,143,.07),rgba(255,63,143,.015) 45%,rgba(0,0,0,.3)),var(--card);border:1px solid var(--border);border-radius:18px;padding:20px}.top{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;margin-bottom:15px}.name{font-size:18px;font-weight:800}.status{font-size:12px;font-weight:800;border-radius:999px;padding:6px 10px;background:#222;color:#bbb;text-transform:capitalize}.status.pending{color:var(--pink);background:rgba(255,63,143,.1)}.status.accepted{color:var(--success);background:rgba(54,217,139,.1)}.status.rejected,.status.cancelled{color:var(--danger);background:rgba(255,77,103,.1)}.status.completed{color:#ddd;background:#222}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.item{background:#090909;border:1px solid rgba(255,255,255,.06);border-radius:11px;padding:11px}.label{font-size:11px;color:#777;margin-bottom:4px}.value{font-size:13px;color:#eee;line-height:1.45;word-break:break-word}.address{margin-top:10px}.actions{display:flex;gap:10px;margin-top:15px}.actions button{flex:1;border:0;border-radius:11px;padding:12px;font-weight:800;cursor:pointer}.accept{background:var(--success);color:#04150e}.reject{background:rgba(255,77,103,.12);color:#ff9eaa;border:1px solid rgba(255,77,103,.25)!important}.actions button:disabled{opacity:.55;cursor:wait}.empty{padding:45px 20px;text-align:center;border:1px dashed rgba(255,255,255,.1);border-radius:16px;color:#777}.loading{text-align:center;padding:60px;color:#aaa}.small{font-size:12px;color:#777;margin-top:12px;line-height:1.5}@media(max-width:560px){.nav{height:62px;padding:0 14px}.brand{font-size:21px}.nav-link{display:none}.container{padding:24px 12px 50px}.grid{grid-template-columns:1fr}.card{padding:16px}.actions{flex-direction:column}}
</style>
</head>
<body>
<header><div class="nav"><a class="brand" href="index.html">ELY<span>RA</span></a><div class="nav-right"><a class="nav-link" href="creator-dashboard.html">Dashboard</a><button class="logout" id="logout">Logout</button></div></div></header>
<main class="container">
<section class="heading"><h1>Booking <span>Requests</span></h1><p>Review customer requests and accept or reject them. Meeting addresses are visible only to the involved creator and customer.</p></section>
<div id="notice" class="notice"></div>
<div class="tabs"><button class="tab active" data-filter="all">All</button><button class="tab" data-filter="pending">Pending</button><button class="tab" data-filter="accepted">Accepted</button><button class="tab" data-filter="completed">Completed</button><button class="tab" data-filter="rejected">Rejected</button></div>
<div id="list" class="list"><div class="loading">Loading booking requests...</div></div>
</main>
<script>
const SUPABASE_URL="https://frvvacirnfvlxifvopcm.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_l7fygMVXGAkbskkiBom8uw_-86tU6L0";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let currentUser=null,bookings=[],filter="all";
const list=document.getElementById("list"),notice=document.getElementById("notice");
function escapeHtml(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;").replace(/'/g,"&#039;")}
function showNotice(text,type="success"){notice.textContent=text;notice.className=`notice show ${type}`}
function money(v){return `₹${Number(v||0).toLocaleString("en-IN")}`}
function dateText(v){if(!v)return "—";return new Date(`${v}T00:00:00`).toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"})}
function timeText(v){if(!v)return "—";return String(v).slice(0,5)}
function render(){const rows=filter==="all"?bookings:bookings.filter(b=>b.status===filter);if(!rows.length){list.innerHTML='<div class="empty">No booking requests in this section.</div>';return}list.innerHTML=rows.map(b=>{const canAct=b.status==="pending";return `<article class="card"><div class="top"><div><div class="name">${escapeHtml(b.customer_name||"Customer")}</div><div class="small">Booking ID: ${escapeHtml(String(b.id).slice(0,8))}</div></div><span class="status ${escapeHtml(b.status||"pending")}">${escapeHtml(b.status||"pending")}</span></div><div class="grid"><div class="item"><div class="label">Date</div><div class="value">${dateText(b.booking_date)}</div></div><div class="item"><div class="label">Time</div><div class="value">${timeText(b.start_time)} – ${timeText(b.end_time)}</div></div><div class="item"><div class="label">Duration</div><div class="value">${escapeHtml(b.duration_hours||b.hours||1)} hour(s)</div></div><div class="item"><div class="label">Booking amount</div><div class="value">${money(b.amount??b.total_amount)}</div></div><div class="item"><div class="label">Customer phone</div><div class="value">${escapeHtml(b.customer_phone||"Not provided")}</div></div><div class="item"><div class="label">Requested</div><div class="value">${b.created_at?new Date(b.created_at).toLocaleString("en-IN"):"—"}</div></div></div><div class="item address"><div class="label">Meeting address</div><div class="value">${escapeHtml(b.meeting_address||"Not provided")}</div></div>${b.notes?`<div class="item address"><div class="label">Customer note</div><div class="value">${escapeHtml(b.notes)}</div></div>`:""}${canAct?`<div class="actions"><button class="accept" data-id="${escapeHtml(b.id)}" data-action="accepted">✓ Accept Booking</button><button class="reject" data-id="${escapeHtml(b.id)}" data-action="rejected">Reject</button></div>`:""}</article>`}).join("")}
async function load(){const {data:{session},error}=await supabaseClient.auth.getSession();if(error||!session){location.href="login.html?redirect=creator-bookings.html";return}currentUser=session.user;const {data,error:queryError}=await supabaseClient.from("bookings").select("id,customer_id,creator_id,booking_date,start_time,end_time,duration_hours,hours,amount,total_amount,status,customer_name,customer_phone,meeting_address,notes,created_at,updated_at").eq("creator_id",currentUser.id).order("created_at",{ascending:false});if(queryError){console.error(queryError);list.innerHTML='<div class="empty">Could not load booking requests. If this is the first time, run the creator booking security SQL supplied with this update.</div>';return}bookings=data||[];render()}
async function setStatus(id,status){const row=bookings.find(x=>x.id===id);if(!row||row.status!=="pending")return;const buttons=[...document.querySelectorAll(`[data-id="${CSS.escape(String(id))}"]`)];buttons.forEach(b=>b.disabled=true);const {data,error}=await supabaseClient.from("bookings").update({status,updated_at:new Date().toISOString()}).eq("id",id).eq("creator_id",currentUser.id).eq("status","pending").select("id,status").maybeSingle();if(error||!data){console.error(error);showNotice(error?.message||"Booking status could not be updated.","error");buttons.forEach(b=>b.disabled=false);return}row.status=data.status;showNotice(status==="accepted"?"✓ Booking accepted successfully.":"Booking rejected.");render()}
document.addEventListener("click",e=>{const tab=e.target.closest(".tab");if(tab){document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));tab.classList.add("active");filter=tab.dataset.filter;render();return}const action=e.target.closest("[data-action]");if(action)setStatus(action.dataset.id,action.dataset.action)});
document.getElementById("logout").addEventListener("click",async()=>{await supabaseClient.auth.signOut();location.href="index.html"});
load();
</script>
</body>
</html>
