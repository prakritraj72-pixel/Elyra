<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Elyra</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; font-family: Arial, sans-serif; background: radial-gradient(circle at top left, #3a0d20 0%, transparent 35%), radial-gradient(circle at bottom right, #24103d 0%, transparent 35%), #080709; color: white; display: flex; justify-content: center; align-items: center; padding: 25px; }
    .container { width: 100%; max-width: 470px; }
    .logo { text-align: center; font-size: 32px; font-weight: 800; letter-spacing: 5px; margin-bottom: 8px; }
    .tagline { text-align: center; color: #aaa; margin-bottom: 25px; font-size: 14px; }
    .card { background: rgba(20, 17, 22, 0.95); border: 1px solid #302934; border-radius: 22px; padding: 30px; box-shadow: 0 20px 60px rgba(0,0,0,.45); }
    h1 { font-size: 27px; margin-bottom: 8px; }
    .subtitle { color: #999; font-size: 14px; margin-bottom: 25px; }
    label { display: block; font-size: 13px; color: #cfcfcf; margin-bottom: 7px; }
    input { width: 100%; padding: 14px 15px; border-radius: 11px; border: 1px solid #39333d; background: #100e12; color: white; outline: none; margin-bottom: 17px; font-size: 14px; }
    input:focus { border-color: #9b315b; }
    .forgot { display: block; text-align: right; color: #e28aae; text-decoration: none; font-size: 13px; margin-top: -8px; margin-bottom: 18px; }
    .forgot:hover { text-decoration: underline; }
    button { width: 100%; border: none; padding: 15px; border-radius: 12px; background: linear-gradient(135deg, #8e234d, #4e1e62); color: white; font-weight: 700; font-size: 15px; cursor: pointer; }
    button:disabled { opacity: .6; cursor: not-allowed; }
    .google-btn { margin-top: 12px; background: #fff; color: #171717; border: 1px solid #ddd; display: flex; align-items: center; justify-content: center; gap: 10px; }
    .google-btn:hover { background: #f5f5f5; }
    .google-icon { width: 19px; height: 19px; flex: 0 0 19px; }
    .divider { display: flex; align-items: center; gap: 12px; margin: 18px 0 6px; color: #777; font-size: 12px; }
    .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: #302934; }
    .message { display: none; margin-top: 15px; padding: 12px; border-radius: 10px; font-size: 13px; line-height: 1.5; }
    .error { display: block; background: rgba(150, 30, 50, .15); border: 1px solid #692637; color: #ff9cad; }
    .success { display: block; background: rgba(30, 130, 80, .12); border: 1px solid #286b4b; color: #8ce0b2; }
    .register { text-align: center; color: #999; font-size: 14px; margin-top: 22px; }
    .register a { color: #e28aae; text-decoration: none; }
    .back { display: block; text-align: center; margin-top: 18px; color: #777; text-decoration: none; font-size: 13px; }
  </style>
</head>
<body>
<div class="container">
  <div class="logo">ELYRA</div>
  <div class="tagline">Meet someone worth knowing.</div>
  <div class="card">
    <h1>Welcome back</h1>
    <p class="subtitle">Log in to continue to Elyra.</p>

    <form id="loginForm">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required>

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" required>

      <a href="forgot-password.html" class="forgot">Forgot password?</a>

      <button type="submit" id="loginBtn">Log in</button>

      <div class="divider"><span>OR</span></div>

      <button type="button" id="googleBtn" class="google-btn">
        <svg class="google-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#4285F4" d="M21.35 12.27c0-.71-.06-1.4-.18-2.05H12v3.88h5.24a4.48 4.48 0 0 1-1.94 2.94v2.44h3.14c1.84-1.69 2.91-4.18 2.91-7.21z"/>
          <path fill="#34A853" d="M12 21.84c2.63 0 4.84-.87 6.45-2.36l-3.14-2.44c-.87.58-1.98.92-3.31.92-2.54 0-4.69-1.72-5.46-4.03H3.29v2.52A9.74 9.74 0 0 0 12 21.84z"/>
          <path fill="#FBBC05" d="M6.54 13.93a5.86 5.86 0 0 1 0-3.76V7.65H3.29a9.84 9.84 0 0 0 0 8.8l3.25-2.52z"/>
          <path fill="#EA4335" d="M12 6.14c1.43 0 2.72.49 3.73 1.46l2.8-2.8C16.84 3.22 14.63 2.16 12 2.16a9.74 9.74 0 0 0-8.71 5.49l3.25 2.52C7.31 7.86 9.46 6.14 12 6.14z"/>
        </svg>
        Continue with Google
      </button>

      <div id="message" class="message"></div>
    </form>

    <div class="register">
      Don't have an account?
      <a href="register.html">Create account</a>
    </div>

    <a class="back" href="index.html">← Back to Elyra</a>
  </div>
</div>

<script>
  const SUPABASE_URL = "https://frvvacirnfvlxifvopcm.supabase.co";
  const SUPABASE_KEY = "sb_publishable_l7fygMVXGAkbskkiBom8uw_-86tU6L0";

  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const form = document.getElementById("loginForm");
  const button = document.getElementById("loginBtn");
  const googleButton = document.getElementById("googleBtn");
  const message = document.getElementById("message");

  function showMessage(text, type) {
    message.textContent = text;
    message.className = "message " + type;
  }

  function getRedirectPage() {
    const params = new URLSearchParams(window.location.search);
    const redirect = params.get("redirect");
    if (redirect && !redirect.startsWith("http://") && !redirect.startsWith("https://") && !redirect.startsWith("//") && !redirect.includes(":")) {
      return redirect;
    }
    return "index.html";
  }

  form.addEventListener("submit", async function(event) {
    event.preventDefault();
    const email = document.getElementById("email").value.trim().toLowerCase();
    const password = document.getElementById("password").value;

    if (!email || !password) {
      showMessage("Please enter your email and password.", "error");
      return;
    }

    button.disabled = true;
    googleButton.disabled = true;
    button.textContent = "Logging in...";

    try {
      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) throw error;
      if (!data || !data.user) throw new Error("Login failed. Please try again.");

      const user = data.user;
      const { data: profile, error: profileError } = await supabaseClient
        .from("profiles")
        .select("id, role, full_name, username")
        .eq("id", user.id)
        .maybeSingle();

      if (profileError) console.error("Profile check error:", profileError);

      if (!profile) {
        const metadata = user.user_metadata || {};
        const ageValue = Number(metadata.age);
        const profileData = {
          id: user.id,
          full_name: metadata.full_name || "",
          username: metadata.username || email.split("@")[0],
          age: Number.isInteger(ageValue) && ageValue >= 18 && ageValue <= 100 ? ageValue : null,
          city: metadata.city || "",
          role: "customer"
        };
        const { error: insertError } = await supabaseClient.from("profiles").insert(profileData);
        if (insertError) console.error("Profile creation error:", insertError);
      }

      showMessage("Login successful! Redirecting...", "success");
      const redirectPage = getRedirectPage();
      setTimeout(function() { window.location.href = redirectPage; }, 700);
    } catch (error) {
      console.error("Login error:", error);
      let errorMessage = error?.message || "Unable to log in. Please try again.";
      if (errorMessage.toLowerCase().includes("email not confirmed")) errorMessage = "Please verify your email before logging in.";
      if (errorMessage.toLowerCase().includes("invalid login credentials")) errorMessage = "Incorrect email or password.";
      showMessage(errorMessage, "error");
    }

    button.disabled = false;
    googleButton.disabled = false;
    button.textContent = "Log in";
  });

  googleButton.addEventListener("click", async function() {
    googleButton.disabled = true;
    button.disabled = true;
    googleButton.textContent = "Opening Google...";

    try {
      const redirectPage = getRedirectPage();
      const callbackUrl = window.location.origin + window.location.pathname.replace(/\/[^/]*$/, "/") + "oauth-callback.html";
      sessionStorage.setItem("elyra_google_redirect", redirectPage);

      const { error } = await supabaseClient.auth.signInWithOAuth({
        provider: "google",
        options: {
          redirectTo: callbackUrl
        }
      });

      if (error) throw error;
    } catch (error) {
      console.error("Google login error:", error);
      showMessage(error?.message || "Google login could not be started.", "error");
      googleButton.disabled = false;
      button.disabled = false;
      googleButton.innerHTML = '<svg class="google-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M21.35 12.27c0-.71-.06-1.4-.18-2.05H12v3.88h5.24a4.48 4.48 0 0 1-1.94 2.94v2.44h3.14c1.84-1.69 2.91-4.18 2.91-7.21z"/><path fill="#34A853" d="M12 21.84c2.63 0 4.84-.87 6.45-2.36l-3.14-2.44c-.87.58-1.98.92-3.31.92-2.54 0-4.69-1.72-5.46-4.03H3.29v2.52A9.84 9.84 0 0 0 3.29 16.45l3.25-2.52z"/><path fill="#FBBC05" d="M6.54 13.93a5.86 5.86 0 0 1 0-3.76V7.65H3.29a9.84 9.84 0 0 0 0 8.8l3.25-2.52z"/><path fill="#EA4335" d="M12 6.14c1.43 0 2.72.49 3.73 1.46l2.8-2.8C16.84 3.22 14.63 2.16 12 2.16a9.74 9.74 0 0 0-8.71 5.49l3.25 2.52C7.31 7.86 9.46 6.14 12 6.14z"/></svg>Continue with Google';
    }
  });

  async function checkExistingSession() {
    const { data } = await supabaseClient.auth.getSession();
    if (data && data.session && data.session.user) {
      const params = new URLSearchParams(window.location.search);
      if (params.get("redirect")) window.location.href = getRedirectPage();
    }
  }

  checkExistingSession();
</script>
</body>
</html>
