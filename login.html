<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Elyra</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top left, #3a0d20 0%, transparent 35%),
        radial-gradient(circle at bottom right, #24103d 0%, transparent 35%),
        #080709;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px;
    }

    .container {
      width: 100%;
      max-width: 470px;
    }

    .logo {
      text-align: center;
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 5px;
      margin-bottom: 8px;
    }

    .tagline {
      text-align: center;
      color: #aaa;
      margin-bottom: 25px;
      font-size: 14px;
    }

    .card {
      background: rgba(20, 17, 22, 0.95);
      border: 1px solid #302934;
      border-radius: 22px;
      padding: 30px;
      box-shadow: 0 20px 60px rgba(0,0,0,.45);
    }

    h1 {
      font-size: 27px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #999;
      font-size: 14px;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-size: 13px;
      color: #cfcfcf;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 14px 15px;
      border-radius: 11px;
      border: 1px solid #39333d;
      background: #100e12;
      color: white;
      outline: none;
      margin-bottom: 17px;
      font-size: 14px;
    }

    input:focus {
      border-color: #9b315b;
    }

    .forgot {
      display: block;
      text-align: right;
      color: #e28aae;
      text-decoration: none;
      font-size: 13px;
      margin-top: -8px;
      margin-bottom: 18px;
    }

    .forgot:hover {
      text-decoration: underline;
    }

    button {
      width: 100%;
      border: none;
      padding: 15px;
      border-radius: 12px;
      background: linear-gradient(135deg, #8e234d, #4e1e62);
      color: white;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.5;
    }

    .error {
      display: block;
      background: rgba(150, 30, 50, .15);
      border: 1px solid #692637;
      color: #ff9cad;
    }

    .success {
      display: block;
      background: rgba(30, 130, 80, .12);
      border: 1px solid #286b4b;
      color: #8ce0b2;
    }

    .register {
      text-align: center;
      color: #999;
      font-size: 14px;
      margin-top: 22px;
    }

    .register a {
      color: #e28aae;
      text-decoration: none;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #777;
      text-decoration: none;
      font-size: 13px;
    }
  </style>

</head>

<body>

<div class="container">

  <div class="logo">ELYRA</div>
  <div class="tagline">Meet someone worth knowing.</div>

  <div class="card">

```
<h1>Welcome back</h1>

  <label for="email">Email</label>

  <input

  <input

```

  </div>
</div>

<script>

  /* ==============================
     SUPABASE CONNECTION
     ============================== */

  const SUPABASE_URL =
    "https://frvvacirnfvlxifvopcm.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_l7fygMVXGAkbskkiBom8uw_-86tU6L0";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* ==============================
     ELEMENTS
     ============================== */

  const form =
    document.getElementById("loginForm");

  const button =
    document.getElementById("loginBtn");

  const message =
    document.getElementById("message");


  /* ==============================
     MESSAGE
     ============================== */

  function showMessage(text, type) {

    message.textContent = text;

    message.className =
      "message " + type;

  }


  /* ==============================
     SAFE REDIRECT
     ============================== */

  function getRedirectPage() {

    const params =
      new URLSearchParams(window.location.search);

    const redirect =
      params.get("redirect");

    if (
      redirect &&
      !redirect.startsWith("http://") &&
      !redirect.startsWith("https://") &&
      !redirect.startsWith("//") &&
      !redirect.includes(":")
    ) {
      return redirect;
    }

    return "index.html";

  }


  /* ==============================
     LOGIN
     ============================== */

  form.addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();

      const email =
        document.getElementById("email")
        .value
        .trim()
        .toLowerCase();

      const password =
        document.getElementById("password")
        .value;

      if (!email || !password) {

        showMessage(
          "Please enter your email and password.",
          "error"
        );

        return;

      }

      button.disabled = true;

      button.textContent =
        "Logging in...";


      try {

        /* ==============================
           SUPABASE LOGIN
           ============================== */

        const { data, error } =
          await supabaseClient.auth.signInWithPassword({

            email: email,

            password: password

          });


        if (error) {
          throw error;
        }


        if (!data || !data.user) {

          throw new Error(
            "Login failed. Please try again."
          );

        }


        /* ==============================
           CHECK PROFILE
           ============================== */

        const user =
          data.user;

        const { data: profile, error: profileError } =
          await supabaseClient
            .from("profiles")
            .select("id, role, full_name, username")
            .eq("id", user.id)
            .maybeSingle();


        if (profileError) {

          console.error(
            "Profile check error:",
            profileError
          );

        }


        /*
         * Normally the database trigger has already
         * created the profile.
         *
         * If the profile is somehow missing, we try
         * to create it safely from the user's metadata.
         */

        if (!profile) {

          const metadata =
            user.user_metadata || {};

          const ageValue =
            Number(metadata.age);

          const profileData = {

            id: user.id,

            full_name:
              metadata.full_name ||
              "",

            username:
              metadata.username ||
              email.split("@")[0],

            age:
              Number.isInteger(ageValue) &&
              ageValue >= 18 &&
              ageValue <= 100
                ? ageValue
                : null,

            city:
              metadata.city ||
              "",

            role:
              "customer"

          };


          const { error: insertError } =
            await supabaseClient
              .from("profiles")
              .insert(profileData);


          if (insertError) {

            console.error(
              "Profile creation error:",
              insertError
            );

          }

        }


        /* ==============================
           SUCCESS
           ============================== */

        showMessage(
          "Login successful! Redirecting...",
          "success"
        );


        const redirectPage =
          getRedirectPage();


        setTimeout(function() {

          window.location.href =
            redirectPage;

        }, 700);


      } catch (error) {

        console.error(
          "Login error:",
          error
        );


        let errorMessage =
          error?.message ||
          "Unable to log in. Please try again.";


        if (
          errorMessage
            .toLowerCase()
            .includes("email not confirmed")
        ) {

          errorMessage =
            "Please verify your email before logging in.";

        }


        if (
          errorMessage
            .toLowerCase()
            .includes("invalid login credentials")
        ) {

          errorMessage =
            "Incorrect email or password.";

        }


        showMessage(
          errorMessage,
          "error"
        );

      }


      button.disabled = false;

      button.textContent =
        "Log in";

    }
  );


  /* ==============================
     ALREADY LOGGED IN
     ============================== */

  async function checkExistingSession() {

    const { data } =
      await supabaseClient.auth.getSession();

    if (
      data &&
      data.session &&
      data.session.user
    ) {

      /*
       * Don't automatically redirect while the
       * user is typing/login page is being opened.
       *
       * Only redirect if a valid session already
       * exists and the page was intentionally opened.
       */

      const params =
        new URLSearchParams(
          window.location.search
        );

      if (params.get("redirect")) {

        window.location.href =
          getRedirectPage();

      }

    }

  }


  checkExistingSession();

</script>

</body>
</html>
