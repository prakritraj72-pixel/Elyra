<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>ELYRA — My Dashboard</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#080708;color:#fff;font-family:Arial,sans-serif}a{text-decoration:none;color:inherit}.top{height:72px;border-bottom:1px solid #242124;display:flex;align-items:center;justify-content:space-between;padding:0 6%;background:#0b090b}.logo{font-size:26px;font-weight:900;letter-spacing:5px}.logo span{color:#d45c88}.btn{border:1px solid #292529;background:#111;color:#ddd;border-radius:22px;padding:10px 16px;cursor:pointer}.wrap{max-width:1100px;margin:35px auto;padding:0 18px 60px}.hero,.panel{border:1px solid #282329;border-radius:20px;background:#100d10;padding:25px}.hero h1{font-size:38px;margin:0 0 8px}.hero p,.muted{color:#888}.tabs{display:flex;gap:8px;margin:20px 0;overflow:auto}.tab{border:1px solid #292529;background:#0e0c0e;color:#aaa;border-radius:10px;padding:11px 16px;cursor:pointer}.tab.active{border-color:#d45c88;color:#fff}.hidden{display:none}.booking{background:#111;border:1px solid #282329;border-radius:16px;padding:18px;margin-bottom:12px}.row{display:flex;justify-content:space-between;gap:12px}.status{padding:6px 10px;border-radius:20px;font-size:11px;text-transform:uppercase}.accepted{color:#8ff0b7;border:1px solid #285d46}.pending{color:#ffd68a;border:1px solid #5d4d28}.rejected{color:#ff9b9b;border:1px solid #633333}.completed{color:#b9a8ff;border:1px solid #514475}.contact{margin-top:14px;padding:14px;border-radius:13px;border:1px solid #285d46;background:#0c1711}.contact strong{color:#8ff0b7}.contact div{padding:5px 0;font-size:13px}.contact a{color:#ff75ad}.contact-btn{margin-top:10px;border:1px solid #d45c88;background:#171017;color:#fff;border-radius:10px;padding:10px 14px;cursor:pointer}.contact-btn:disabled{opacity:.6;cursor:wait}.status-note{margin-top:12px;padding:11px 12px;border-radius:10px;background:#0d0b0d;border:1px solid #242124;color:#aaa;font-size:13px;line-height:1.5}.status-note.accepted-note{color:#9ff3bd;border-color:#285d46}.status-note.rejected-note{color:#ff9b9b;border-color:#633333}.status-note.pending-note{color:#ffe0a1;border-color:#5d4d28}.rating-box{margin-top:14px;padding:14px;border-radius:13px;border:1px solid #514475;background:#100d18}.stars{display:flex;gap:6px;margin:9px 0}.star-btn{border:1px solid #3a3045;background:#17121d;color:#777;border-radius:9px;padding:7px 10px;cursor:pointer}.star-btn.active{color:#ffd36e;border-color:#8b6b2d;background:#211b10}.rating-submit{border:0;background:linear-gradient(135deg,#d45c88,#8c55bd);color:#fff;border-radius:9px;padding:9px 13px;cursor:pointer;font-weight:700;font-size:12px}.empty{text-align:center;color:#777;padding:45px}.notice{padding:14px;border:1px solid #282329;border-radius:12px;color:#aaa;line-height:1.6}@media(max-width:600px){.hero h1{font-size:30px}.top{padding:0 4%}.row{align-items:flex-start}.status{flex-shrink:0}}

</style><style id="elyra-back-style">
.elyra-back-button{position:fixed;top:16px;left:16px;z-index:99999;width:42px;height:42px;border:1px solid rgba(255,255,255,.12);border-radius:50%;background:rgba(8,7,8,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:#fff;display:flex;align-items:center;justify-content:center;font-size:25px;line-height:1;cursor:pointer;box-shadow:0 6px 24px rgba(0,0,0,.28);transition:.2s ease}
.elyra-back-button:hover{transform:translateX(-2px);border-color:rgba(240,107,170,.55);color:#f06baa}
.elyra-back-button:active{transform:scale(.94)}
@media(max-width:600px){.elyra-back-button{top:12px;left:12px;width:40px;height:40px;font-size:23px}}
</style></head><body><button class="elyra-back-button" id="elyraBackButton" aria-label="Go back" title="Go back">‹</button>
<script>
(function(){
  const b=document.getElementById("elyraBackButton");
  if(!b)return;
  b.addEventListener("click",function(){
    if(history.length>1) history.back();
    else window.location.href="/index.html";
  });
})();
</script><header class="top"><a class="logo" href="index.html">ELY<span>RA</span></a><div><a class="btn" href="creators.html">Browse</a> <button class="btn" id="logout">Log out</button></div></header><main class="wrap"><section class="hero"><h1 id="welcome">My Dashboard</h1><p>Track every booking here. Pending, accepted and rejected requests are shown automatically.</p></section><div class="tabs"><button class="tab active" data-tab="bookings">My Bookings</button><button class="tab" data-tab="account">Account</button></div><section id="bookings" class="panel"><div id="bookingContent" class="empty">Loading bookings...</div></section><section id="account" class="panel hidden"><div id="accountContent" class="notice">Loading account...</div></section></main><script>
const SUPABASE_URL="https://frvvacirnfvlxifvopcm.supabase.co",SUPABASE_KEY="sb_publishable_l7fygMVXGAkbskkiBom8uw_-86tU6L0";const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&','<':'<','>':'>','"':'"'}[c]))}function showTab(id){document.querySelectorAll('section[id]').forEach(x=>x.classList.toggle('hidden',x.id!==id));document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===id))}

async function contact(id,button,box){
button.disabled=true;
button.textContent='Loading contact…';
box.innerHTML='<div>Checking booking access…</div>';

try{
const {data:{session}}=await sb.auth.getSession();

if(!session){
throw new Error('Your session has expired. Please log in again.');
}

const r=await fetch(`${SUPABASE_URL}/functions/v1/booking-contact`,{
method:'POST',
headers:{
Authorization:`Bearer ${session.access_token}`,
apikey:SUPABASE_KEY,
'Content-Type':'application/json'
},
body:JSON.stringify({booking_id:id})
});

const d=await r.json().catch(()=>null);

/* FIX: booking-contact returns ok:true */
if(!r.ok||(!d?.ok&&!d?.success)){
throw new Error(d?.error||`Contact service returned ${r.status}`);
}

const c=d.contact||{};

box.innerHTML=` <strong>✓ Creator contact unlocked</strong>
${c.name?`<div>Name: ${esc(c.name)}</div>`:''}
${c.phone?`<div>Phone: <a href="tel:${esc(c.phone)}">${esc(c.phone)}</a></div>`:'<div>Phone: Not available</div>'}
${c.email?`<div>Email: <a href="mailto:${esc(c.email)}">${esc(c.email)}</a></div>`:''}

<div class="muted">Contact is visible because this booking was accepted.</div>
`;

button.remove();

}catch(e){

console.error('ELYRA CONTACT ERROR:',e);

box.innerHTML=`

<div style="color:#ff9b9b">${esc(e.message||'Contact details could not be loaded.')}</div>
<div class="muted" style="margin-top:6px">
Please retry. The secure contact service returned an error.
</div>
`;

button.disabled=false;
button.textContent='Retry contact';
}
}

async function init(){
const {data,error}=await sb.auth.getUser();

if(error||!data.user){
location.href='login.html?redirect=profile.html';
return;
}

const u=data.user;

const name=u.user_metadata?.username||u.user_metadata?.full_name||u.email?.split('@')[0]||'Account';

$('welcome').textContent='Hi, '+name;

$('accountContent').innerHTML=`<strong>${esc(name)}</strong><br> <span class="muted">${esc(u.email||'')}</span> <br><br>
Your booking status and accepted creator contacts are available from My Bookings.`;

const {data:rows,error:be}=await sb
.from('bookings')
.select('id,creator_id,booking_date,start_time,end_time,duration_hours,amount,status')
.eq('customer_id',u.id)
.order('created_at',{ascending:false});

if(be){
$('bookingContent').innerHTML='<div class="empty">Could not load bookings.</div>';
return;
}

if(!rows?.length){
$('bookingContent').innerHTML='<div class="empty">No bookings yet.<br><br><a class="btn" href="creators.html">Browse Creators</a></div>';
return;
}

const ids=[...new Set(rows.map(x=>x.creator_id).filter(Boolean))];

const {data:creators}=await sb
.from('public_creator_profiles')
.select('id,display_name')
.in('id',ids);

rows.forEach(x=>x.creator=(creators||[]).find(c=>c.id===x.creator_id));

$('bookingContent').innerHTML=rows.map(b=>{

const st=String(b.status||'pending').toLowerCase();

let note='';

if(st==='pending')
note='<div class="status-note pending-note">⏳ Booking request sent. Waiting for the creator to accept or reject it.</div>';

if(st==='accepted')
note='<div class="status-note accepted-note">✓ Booking confirmed. Your creator contact can now be unlocked.</div>';

if(st==='rejected')
note='<div class="status-note rejected-note">✕ Booking rejected by the creator.</div>';

if(st==='completed')
note='<div class="status-note">✓ Booking completed.</div>';

return `

<article class="booking" data-id="${esc(b.id)}">

<div class="row">

<div>
<strong>${esc(b.creator?.display_name||'Creator')}</strong>

<div class="muted">
${esc(b.booking_date||'')} ·
${esc(String(b.start_time||'').slice(0,5))} –
${esc(String(b.end_time||'').slice(0,5))} ·
${esc(b.duration_hours||1)} hour(s) ·
₹${Number(b.amount||0).toLocaleString('en-IN')}
</div>

</div>

<span class="status ${st}">
${esc(st)}
</span>

</div>

${note}

${st==='accepted'?
`

<div class="contact" data-contact>
<strong>✓ Creator contact</strong>
<div>Contact is protected and available only for accepted bookings.</div>
<button class="contact-btn" type="button" data-contact-btn>
View creator contact
</button>
</div>
`
:''}

</article>
`;

}).join('');

document.querySelectorAll('[data-rating-box]').forEach(box=>{let selected=0;box.querySelectorAll('[data-rating]').forEach(s=>s.addEventListener('click',()=>{selected=Number(s.dataset.rating);box.querySelectorAll('[data-rating]').forEach(x=>x.classList.toggle('active',Number(x.dataset.rating)<=selected));}));box.querySelector('[data-rating-submit]').addEventListener('click',async()=>{if(!selected){alert('Please select a rating.');return}const article=box.closest('[data-id]');const btn=box.querySelector('[data-rating-submit]');btn.disabled=true;btn.textContent='Submitting…';const{error}=await sb.rpc('submit_creator_rating',{p_booking_id:article.dataset.id,p_rating:selected,p_comment:null});if(error){alert(error.message);btn.disabled=false;btn.textContent='Submit rating';return}box.innerHTML='<strong style="color:#9ff0c2">✓ Rating submitted. Thank you!</strong>';});});

document.querySelectorAll('[data-contact-btn]').forEach(btn=>{

btn.addEventListener('click',()=>{

const article=btn.closest('[data-id]');
const box=article.querySelector('[data-contact]');

contact(article.dataset.id,btn,box);

});

});

document.querySelectorAll('.tab').forEach(x=>
x.onclick=()=>showTab(x.dataset.tab)
);

$('logout').onclick=async()=>{
await sb.auth.signOut();
location.href='index.html';
};

}

init(); </script></body></html>
