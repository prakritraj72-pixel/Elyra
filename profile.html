<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>ELYRA — My Dashboard</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#080708;color:#fff;font-family:Arial,sans-serif}a{text-decoration:none;color:inherit}.top{height:72px;border-bottom:1px solid #242124;display:flex;align-items:center;justify-content:space-between;padding:0 6%;background:#0b090b}.logo{font-size:26px;font-weight:900;letter-spacing:5px}.logo span{color:#d45c88}.btn{border:1px solid #292529;background:#111;color:#ddd;border-radius:22px;padding:10px 16px;cursor:pointer}.wrap{max-width:1100px;margin:35px auto;padding:0 18px 60px}.hero,.panel{border:1px solid #282329;border-radius:20px;background:#100d10;padding:25px}.hero h1{font-size:38px;margin:0 0 8px}.hero p,.muted{color:#888}.tabs{display:flex;gap:8px;margin:20px 0;overflow:auto}.tab{border:1px solid #292529;background:#0e0c0e;color:#aaa;border-radius:10px;padding:11px 16px;cursor:pointer}.tab.active{border-color:#d45c88;color:#fff}.hidden{display:none}.booking{background:#111;border:1px solid #282329;border-radius:16px;padding:18px;margin-bottom:12px}.row{display:flex;justify-content:space-between;gap:12px}.status{padding:6px 10px;border-radius:20px;font-size:11px;text-transform:uppercase}.accepted{color:#8ff0b7;border:1px solid #285d46}.pending{color:#ffd68a;border:1px solid #5d4d28}.contact{margin-top:14px;padding:14px;border-radius:13px;border:1px solid #285d46;background:#0c1711}.contact strong{color:#8ff0b7}.contact div{padding:5px 0;font-size:13px}.contact a{color:#ff75ad}.empty{text-align:center;color:#777;padding:45px}.notice{padding:14px;border:1px solid #282329;border-radius:12px;color:#aaa;line-height:1.6}@media(max-width:600px){.hero h1{font-size:30px}.top{padding:0 4%}}</style></head><body><header class="top"><a class="logo" href="index.html">ELY<span>RA</span></a><div><a class="btn" href="creators.html">Browse</a> <button class="btn" id="logout">Log out</button></div></header><main class="wrap"><section class="hero"><h1 id="welcome">My Dashboard</h1><p>Manage your bookings and see creator contact details after acceptance.</p></section><div class="tabs"><button class="tab active" data-tab="bookings">My Bookings</button><button class="tab" data-tab="account">Account</button></div><section id="bookings" class="panel"><div id="bookingContent" class="empty">Loading bookings...</div></section><section id="account" class="panel hidden"><div id="accountContent" class="notice">Loading account...</div></section></main><script>
const SUPABASE_URL="https://frvvacirnfvlxifvopcm.supabase.co",SUPABASE_KEY="sb_publishable_l7fygMVXGAkbskkiBom8uw_-86tU6L0";const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}function showTab(id){document.querySelectorAll('section[id]').forEach(x=>x.classList.toggle('hidden',x.id!==id));document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===id))}async function contact(id){const {data:{session}}=await sb.auth.getSession();if(!session)return null;const r=await fetch(`${SUPABASE_URL}/functions/v1/booking-contact`,{method:'POST',headers:{Authorization:`Bearer ${session.access_token}`,apikey:SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({booking_id:id})});const d=await r.json().catch(()=>null);return r.ok&&d?.ok?d.contact:null}async function init(){const {data,error}=await sb.auth.getUser();if(error||!data.user){location.href='login.html?redirect=profile.html';return}const u=data.user;const name=u.user_metadata?.username||u.user_metadata?.full_name||u.email?.split('@')[0]||'Account';$('welcome').textContent='Hi, '+name;$('accountContent').innerHTML=`<strong>${esc(name)}</strong><br><span class="muted">${esc(u.email||'')}</span><br><br>Creator contact details are revealed only for bookings that the creator has accepted.`;const {data:rows,error:be}=await sb.from('bookings').select('id,creator_id,booking_date,start_time,end_time,duration_hours,amount,status').eq('customer_id',u.id).order('created_at',{ascending:false});if(be){$('bookingContent').innerHTML='<div class="empty">Could not load bookings.</div>';return}if(!rows?.length){$('bookingContent').innerHTML='<div class="empty">No bookings yet.</div>';return}const ids=[...new Set(rows.map(x=>x.creator_id).filter(Boolean))];const {data:creators}=await sb.from('public_creator_profiles').select('id,display_name').in('id',ids);rows.forEach(x=>x.creator=(creators||[]).find(c=>c.id===x.creator_id));$('bookingContent').innerHTML=rows.map(b=>{const st=String(b.status||'pending').toLowerCase();return `<article class="booking" data-id="${esc(b.id)}"><div class="row"><div><strong>${esc(b.creator?.display_name||'Creator')}</strong><div class="muted">${esc(b.booking_date||'')} · ${esc(String(b.start_time||'').slice(0,5))} – ${esc(String(b.end_time||'').slice(0,5))} · ${esc(b.duration_hours||1)} hour(s) · ₹${Number(b.amount||0).toLocaleString('en-IN')}</div></div><span class="status ${st}">${esc(st)}</span></div>${st==='accepted'?'<div class="contact" data-contact><strong>✓ Creator contact unlocked</strong><div>Loading contact details…</div></div>':''}</article>`}).join('');for(const b of rows.filter(x=>String(x.status||'').toLowerCase()==='accepted')){const box=document.querySelector(`[data-id="${CSS.escape(String(b.id))}"] [data-contact]`);const c=await contact(b.id);if(!box)continue;if(!c){box.innerHTML='<strong>✓ Booking accepted</strong><div>Contact details temporarily unavailable. Refresh to try again.</div>';continue}box.innerHTML=`<strong>✓ Creator contact unlocked</strong><div>Name: ${esc(c.name||'Creator')}</div>${c.phone?`<div>Phone: ${esc(c.phone)}</div>`:''}${c.email?`<div>Email: ${esc(c.email)}</div>`:''}<div class="muted">Shared privately because this booking was accepted.</div>`}}document.querySelectorAll('.tab').forEach(x=>x.onclick=()=>showTab(x.dataset.tab));$('logout').onclick=async()=>{await sb.auth.signOut();location.href='index.html'};init();</script></body></html>
