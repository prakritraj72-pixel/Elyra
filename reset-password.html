
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Reset Password — Elyra</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;

      background:
        radial-gradient(circle at top left, #3a0d20 0%, transparent 35%),
        radial-gradient(circle at bottom right, #24103d 0%, transparent 35%),
        #080709;

      color: white;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 25px;
    }

    .container {
      width: 100%;
      max-width: 470px;
    }

    .logo {
      text-align: center;
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 5px;
      margin-bottom: 8px;
    }

    .tagline {
      text-align: center;
      color: #aaa;
      margin-bottom: 25px;
      font-size: 14px;
    }

    .card {
      background: rgba(20, 17, 22, 0.95);

      border: 1px solid #302934;

      border-radius: 22px;

      padding: 30px;

      box-shadow: 0 20px 60px rgba(0,0,0,.45);
    }

    h1 {
      font-size: 27px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #999;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    label {
      display: block;

      font-size: 13px;

      color: #cfcfcf;

      margin-bottom: 7px;
    }

    input {
      width: 100%;

      padding: 14px 15px;

      border-radius: 11px;

      border: 1px solid #39333d;

      background: #100e12;

      color: white;

      outline: none;

      margin-bottom: 17px;

      font-size: 14px;
    }

    input:focus {
      border-color: #9b315b;
    }

    button {
      width: 100%;

      border: none;

      padding: 15px;

      border-radius: 12px;

      background:
        linear-gradient(135deg, #8e234d, #4e1e62);

      color: white;

      font-weight: 700;

      font-size: 15px;

      cursor: pointer;
    }

    button:disabled {
      opacity: .6;

      cursor: not-allowed;
    }

    .message {
      display: none;

      margin-top: 15px;

      padding: 12px;

      border-radius: 10px;

      font-size: 13px;

      line-height: 1.5;
    }

    .error {
      display: block;

      background: rgba(150, 30, 50, .15);

      border: 1px solid #692637;

      color: #ff9cad;
    }

    .success {
      display: block;

      background: rgba(30, 130, 80, .12);

      border: 1px solid #286b4b;

      color: #8ce0b2;
    }

    .back {
      display: block;

      text-align: center;

      margin-top: 20px;

      color: #e28aae;

      text-decoration: none;

      font-size: 13px;
    }

    .back:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="logo">
    ELYRA
  </div>

  <div class="tagline">
    Meet someone worth knowing.
  </div>


  <div class="card">

    <h1>
      Create a new password
    </h1>

    <p class="subtitle">
      Enter your new password below. Make sure it is at least 6 characters long.
    </p>


    <form id="resetForm">

      <label>
        New password
      </label>

      <input
        type="password"
        id="newPassword"
        placeholder="Enter new password"
        minlength="6"
        required
      >


      <label>
        Confirm password
      </label>

      <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm new password"
        minlength="6"
        required
      >


      <button
        type="submit"
        id="updateBtn"
      >
        Update password
      </button>


      <div
        id="message"
        class="message"
      ></div>

    </form>


    <a
      class="back"
      href="login.html"
    >
      ← Back to Login
    </a>

  </div>

</div>


<script>

  /* ==============================
     SUPABASE CONNECTION
     ============================== */

  const SUPABASE_URL =
    "https://frvvacirnfvlxifvopcm.supabase.co";


  const SUPABASE_KEY =
    "sb_publishable_l7fygMVXGAkbskkiBom8uw_-86tU6L0";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* ==============================
     ELEMENTS
     ============================== */

  const form =
    document.getElementById("resetForm");


  const button =
    document.getElementById("updateBtn");


  const message =
    document.getElementById("message");


  /* ==============================
     MESSAGE
     ============================== */

  function showMessage(text, type) {

    message.textContent = text;

    message.className =
      "message " + type;

  }


  /* ==============================
     CHECK PASSWORD RESET SESSION
     ============================== */

  supabaseClient.auth.onAuthStateChange(
    function(event, session) {

      if (
        event === "PASSWORD_RECOVERY"
      ) {

        console.log(
          "Password recovery session detected."
        );

      }

    }
  );


  /* ==============================
     UPDATE PASSWORD
     ============================== */

  form.addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();


      const newPassword =
        document
          .getElementById("newPassword")
          .value;


      const confirmPassword =
        document
          .getElementById("confirmPassword")
          .value;


      /* Check password length */

      if (newPassword.length < 6) {

        showMessage(
          "Password must be at least 6 characters long.",
          "error"
        );

        return;

      }


      /* Check passwords match */

      if (
        newPassword !== confirmPassword
      ) {

        showMessage(
          "Passwords do not match.",
          "error"
        );

        return;

      }


      button.disabled = true;

      button.textContent =
        "Updating password...";


      try {

        const { error } =
          await supabaseClient.auth.updateUser({

            password: newPassword

          });


        if (error) {

          throw error;

        }


        showMessage(
          "Password updated successfully! Redirecting to login...",
          "success"
        );


        form.reset();


        setTimeout(
          function() {

            window.location.href =
              "login.html";

          },
          2000
        );


      } catch (error) {

        showMessage(
          error.message,
          "error"
        );

      }


      button.disabled = false;

      button.textContent =
        "Update password";

    }
  );

</script>

</body>
</html>
