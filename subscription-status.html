<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>ELYRA — My Subscription</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--bg:#080708;--card:#111014;--line:#292029;--pink:#c85a83;--green:#36d98b;--yellow:#e8bd67;--red:#ff6178;--muted:#99939a}*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,Arial,sans-serif;background:radial-gradient(circle at top,rgba(200,90,131,.15),transparent 35%),var(--bg);color:#fff;min-height:100vh}a{text-decoration:none;color:inherit}.nav{height:70px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 6%;position:sticky;top:0;background:rgba(8,7,8,.92);backdrop-filter:blur(18px);z-index:5}.logo{font-size:24px;font-weight:900;letter-spacing:3px}.logo span{color:var(--pink)}.back{font-size:12px;color:#aaa;border:1px solid var(--line);padding:9px 13px;border-radius:10px}.wrap{max-width:760px;margin:auto;padding:55px 16px 75px}.hero{text-align:center}.eyebrow{display:inline-block;color:#dc9ab2;font-size:10px;text-transform:uppercase;letter-spacing:2px;margin-bottom:12px}.hero h1{font-size:clamp(32px,6vw,52px);letter-spacing:-2px}.hero p{color:var(--muted);font-size:13px;line-height:1.7;margin:12px auto 0;max-width:540px}.card{margin-top:24px;padding:25px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(145deg,rgba(200,90,131,.08),rgba(255,255,255,.015)),var(--card)}.status-head{display:flex;justify-content:space-between;align-items:center;gap:15px}.plan{font-size:18px;font-weight:800}.badge{padding:7px 10px;border-radius:999px;font-size:10px;font-weight:800}.active{color:#8df1bb;background:rgba(54,217,139,.1);border:1px solid rgba(54,217,139,.25)}.inactive{color:#e8bd67;background:rgba(232,189,103,.08);border:1px solid rgba(232,189,103,.2)}.expired{color:#ff9aaa;background:rgba(255,97,120,.08);border:1px solid rgba(255,97,120,.2)}.amount{font-size:35px;font-weight:900;color:var(--pink);margin:18px 0 5px}.label{color:#777;font-size:11px}.rows{margin-top:20px}.row{display:flex;justify-content:space-between;gap:15px;padding:13px 0;border-top:1px solid rgba(255,255,255,.06);font-size:12px}.row span:first-child{color:#888}.row span:last-child{text-align:right;font-weight:700}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}.btn{display:block;text-align:center;padding:12px;border-radius:11px;font-size:12px;font-weight:800;border:1px solid var(--line);background:#181319}.primary{background:var(--pink);border-color:var(--pink)}.empty{text-align:center;color:#aaa}.empty h2{font-size:20px;margin-bottom:8px}.empty p{color:#777;font-size:12px;line-height:1.7}.error{color:#ffb4c0}.loading{text-align:center;color:#777}@media(max-width:600px){.nav{padding:0 14px}.logo{font-size:21px}.back{font-size:11px;padding:8px 10px}.wrap{padding:35px 12px 60px}.card{padding:18px}.status-head{align-items:flex-start}.actions{grid-template-columns:1fr}.row{font-size:11px}}
</style></head><body><header class="nav"><a class="logo" href="index.html">ELY<span>RA</span></a><a class="back" href="index.html">← Home</a></header><main class="wrap"><section class="hero"><div class="eyebrow">Customer Access</div><h1>My <span style="color:var(--pink)">Subscription</span></h1><p>Check whether your Elyra subscription is active, when it expires and which plan is currently linked to your account.</p></section><section id="content" class="card loading">Checking your subscription…</section></main><script>
const SUPABASE_URL='https://frvvacirnfvlxifvopcm.supabase.co',SUPABASE_KEY='sb_publishable_l7fygMVXGAkbskkiBom8uw_-86tU6L0',sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY),content=document.getElementById('content');
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function formatDate(v){if(!v)return '—';return new Date(v).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'})}function planName(p){return p==='monthly'?'Elyra Monthly':p==='yearly'?'Elyra Yearly':String(p||'Elyra Subscription')}function render(sub){if(!sub){content.className='card empty';content.innerHTML='<h2>No active subscription</h2><p>You do not currently have a subscription on your account. Choose a plan to unlock booking access.</p><div class="actions"><a class="btn primary" href="subscription.html?plan=monthly">Get Monthly — ₹199</a><a class="btn" href="subscription.html?plan=yearly">Get Yearly — ₹699</a></div>';return}const expiry=new Date(sub.expires_at),active=sub.status==='active'&&expiry.getTime()>Date.now(),badge=active?'Active':sub.status==='expired'?'Expired':'Inactive';content.className='card';content.innerHTML=`<div class="status-head"><div class="plan">${esc(planName(sub.plan))}</div><span class="badge ${active?'active':sub.status==='expired'?'expired':'inactive'}">${badge}</span></div><div class="amount">₹${Number(sub.amount||0).toLocaleString('en-IN')}</div><div class="label">Subscription amount</div><div class="rows"><div class="row"><span>Plan</span><span>${esc(planName(sub.plan))}</span></div><div class="row"><span>Started</span><span>${esc(formatDate(sub.started_at))}</span></div><div class="row"><span>Expires</span><span>${esc(formatDate(sub.expires_at))}</span></div><div class="row"><span>Time remaining</span><span>${active?esc(remaining(expiry)):'Subscription ended'}</span></div><div class="row"><span>Booking access</span><span>${active?'Available':'Locked'}</span></div></div><div class="actions"><a class="btn primary" href="creators.html">Browse Creators</a><a class="btn" href="subscription.html">View Plans</a></div>`}function remaining(expiry){const ms=Math.max(0,expiry-Date.now()),days=Math.floor(ms/86400000),hours=Math.floor(ms%86400000/3600000);return days+' day'+(days===1?'':'s')+' '+hours+' hour'+(hours===1?'':'s')}async function load(){const{data:{session}}=await sb.auth.getSession();if(!session){location.href='login.html?redirect=subscription-status.html';return}const{data,error}=await sb.from('subscriptions').select('id,plan,amount,status,started_at,expires_at,payment_provider,payment_id,created_at').eq('user_id',session.user.id).order('expires_at',{ascending:false});if(error){content.className='card error';content.innerHTML='Unable to load subscription status right now. Please try again.';return}const rows=data||[];const current=rows.find(s=>s.status==='active'&&new Date(s.expires_at).getTime()>Date.now())||rows[0]||null;render(current)}load();setInterval(load,60000);
</script></body></html>
